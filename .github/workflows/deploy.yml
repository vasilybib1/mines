name: auto deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: checkout repo code
        uses: actions/checkout@v4

      - name: build and start container
        run: | 
          docker compose build
          docker compose up -d
          docker image prune -f 

      - name: verify frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && exit 0
            sleep 1
          done
          echo "frontend didnt start"
          docker compose logs --tail=50
          exit 1

      - name: verify backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "backend didnt start"
          docker compose logs --tail=50
          exit 1
